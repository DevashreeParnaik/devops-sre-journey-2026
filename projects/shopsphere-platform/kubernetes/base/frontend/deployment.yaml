apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-frontend
spec:
  selector:
    matchLabels:
      app: shopsphere-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: shopsphere-frontend
    spec:
      containers:
      - name: shopsphere-frontend
        image: shopsphere-frontend:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
         - name: NEXT_PUBLIC_API_URL
           value: "http://backend-service:8080"
        resources:
          requests:
              cpu: "250m"
              memory: "128Mi"
          limits:
              cpu: "500m"
              memory: "256Mi"