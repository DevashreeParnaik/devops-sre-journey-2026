apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: shopsphere-dev
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: dev.shopsphere.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080